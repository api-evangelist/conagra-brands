description: >-
  Conagra Brands is a leading North American branded consumer packaged goods (CPG)
  food company headquartered in Chicago, Illinois. Its portfolio of iconic frozen,
  refrigerated, and shelf-stable brands includes Marie Callender's, Healthy Choice,
  Slim Jim, Reddi-wip, Hunt's, Banquet, Birds Eye, Duncan Hines, and Orville
  Redenbacher's. Conagra runs no developer program: there is no developer portal,
  no API documentation, no SDKs, no sign-up and no terms of use for API access, and
  both of its GitHub organizations are empty. It does, however, operate one public,
  undocumented API — the Brand Sites API at brands-api.conagrafoods.com, a read-only
  OData v3 service that backs its consumer brand websites and answers anonymous
  requests for 2,267 products and its brand codes. Partner integrations for
  foodservice, retail and supplier programs remain managed through direct B2B
  agreements rather than a public developer surface.
