apis:
  - aid: conagra-brands:conagra-brands-brand-sites-api
    name: Conagra Brand Sites API
    description: >-
      Read-only OData v3 service that supplies product and brand data to Conagra's
      consumer brand websites. The service document at /odata advertises six entity
      sets; two of them resolve — Products (2,267 rows) and Brands — over anonymous
      HTTPS with no key, with full OData query composition ($top, $skip, $select,
      $filter, $orderby, $inlinecount) and server-driven paging at 100 rows via
      odata.nextLink. Conagra publishes no documentation, terms, limits or support
      channel for it, and the CSDL model at /odata/$metadata returns 404 even though
      every response references it, so no OData client can generate a model from the
      service. Discovered and probed by API Evangelist on 2026-09-05.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/conagra-brands.png
    humanURL: https://brands-api.conagrafoods.com/
    baseURL: https://brands-api.conagrafoods.com/odata
