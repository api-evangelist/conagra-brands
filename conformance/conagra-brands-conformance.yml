method: probed
source: >-
  Live probes of https://brands-api.conagrafoods.com/odata on 2026-09-05 (service
  document, response envelopes, response headers, query-option behaviour).
note: >-
  Conagra publishes no compliance claim, standards statement or developer
  documentation for this API. Every entry below is asserted from what the running
  service actually returned, never from marketing prose. Entries that could not be
  established are recorded as conforms:false with the probe that failed.
domain_standard:
  id: odata
  name: OData (Open Data Protocol) v3
  conforms: true
  evidence:
    - https://brands-api.conagrafoods.com/odata
    - "response header: DataServiceVersion: 3.0"
    - "response envelope: odata.metadata / odata.count / odata.nextLink / odata.error"
  signature: >-
    The contract declares itself: the service root returns an AtomPub service document
    (application/atomsvc+xml) enumerating six entity sets, every JSON response carries
    the OData v3 `odata.metadata` annotation pointing at $metadata, paging is emitted as
    `odata.nextLink`, counts as `odata.count`, and errors as the `odata.error` envelope.
  caveat: >-
    The CSDL metadata document itself is NOT reachable. GET /odata/$metadata (and the
    %24-encoded form, with and without $format) returns the IIS static-file 404 page,
    while /odata/$batch reaches ASP.NET routing and returns an odata.error - so the `$`
    is not being filtered wholesale, the metadata endpoint is simply not served. Every
    response advertises a $metadata URL that 404s, which is the single biggest
    integration defect on this surface.
